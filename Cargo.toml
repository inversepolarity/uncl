[package]
name = "uncl"
version = "0.1.1"
edition = "2024"

[dependencies]
# No UI toolkit: `app::render` writes the frame itself (docs/rendering-report.md
# §6.3). That dropped `ratatui` and the `unicode-width` pin it dragged in, and
# removed the second copy of the grid that every frame used to walk.
crossterm = "0.29"
portable-pty = "0.8.1"
anyhow = "1.0.98"
# pinned to the version that exposes parser callbacks + terminal modes, so we
# never have to sniff the byte stream by hand (see docs/rendering-report.md §2.5)
vt100 = "0.18.1"
tokio = { version = "1.44.2", features = ["full"] }
bytes = "1.11.1"
# tui-term/ratatui removed: the grid adapter and the pseudo-terminal widget were
# replaced by `src/app/render` (S2), so a frame no longer passes through a
# second, ratatui-shaped copy of the parser's grid.
#regex = "1.11.1"
#nix = {version="0.30.1",features=[ "term"]}
