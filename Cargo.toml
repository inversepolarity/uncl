[package]
name = "uncl"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.27"
ratatui = "0.29"
portable-pty = "0.8.1"
anyhow = "1.0.98"
# pinned to the version that exposes parser callbacks + terminal modes, so we
# never have to sniff the byte stream by hand (see docs/rendering-report.md §2.5)
vt100 = "0.18.1"
tokio = { version = "1.44.2", features = ["full"] }
bytes = "1.10.1"
# tui-term removed: its adapter is vendored in src/app/ui/adapter.rs and the
# widget it provided is reimplemented in src/app/ui/widget.rs (S0, step 1).
#regex = "1.11.1"
#nix = {version="0.30.1",features=[ "term"]}
